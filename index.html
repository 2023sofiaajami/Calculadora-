<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header class="page-header">
            <h1>Calculadora Científica</h1>
            <p>Diseño inspirado en un sketch de producto</p>
        </header>

        <section class="calculator">

            <!-- PANTALLA -->
            <div class="display-container">
                <span class="display-label">PANTALLA</span>

                <div id="display" class="display">
                    0
                </div>
            </div>


            <!-- TECLADO -->
            <div class="keypad">

                <!-- FUNCIONES CIENTÍFICAS -->
                <button class="key function" data-action="sin">
                    sin
                </button>

                <button class="key function" data-action="cos">
                    cos
                </button>

                <button class="key function" data-action="tan">
                    tan
                </button>

                <button class="key function" data-action="log">
                    log
                </button>

                <button class="key function" data-action="ln">
                    ln
                </button>


                <!-- FUNCIONES ESPECIALES -->
                <button class="key function" data-action="square">
                    x²
                </button>

                <button class="key special" data-action="sqrt">
                    √
                </button>

                <button class="key special" data-action="percent">
                    %
                </button>

                <button class="key function" data-action="pi">
                    π
                </button>

                <button class="key function" data-action="power">
                    xʸ
                </button>


                <!-- MEMORIA -->
                <button class="key memory" data-action="memory-add">
                    M+
                </button>

                <button class="key memory" data-action="memory-subtract">
                    M−
                </button>

                <button class="key memory" data-action="memory-recall">
                    MR
                </button>

                <button class="key memory" data-action="memory-clear">
                    MC
                </button>

                <button class="key memory" data-action="delete">
                    DEL
                </button>


                <!-- NÚMEROS Y OPERACIONES -->
                <button class="key number" data-value="7">
                    7
                </button>

                <button class="key number" data-value="8">
                    8
                </button>

                <button class="key number" data-value="9">
                    9
                </button>

                <button class="key operator" data-action="divide">
                    ÷
                </button>


                <button class="key number" data-value="4">
                    4
                </button>

                <button class="key number" data-value="5">
                    5
                </button>

                <button class="key number" data-value="6">
                    6
                </button>

                <button class="key operator" data-action="multiply">
                    ×
                </button>


                <button class="key number" data-value="1">
                    1
                </button>

                <button class="key number" data-value="2">
                    2
                </button>

                <button class="key number" data-value="3">
                    3
                </button>

                <button class="key operator" data-action="subtract">
                    −
                </button>


                <button class="key number" data-value="0">
                    0
                </button>

                <button class="key number" data-value=".">
                    .
                </button>

                <button class="key equals" data-action="equals">
                    =
                </button>

                <button class="key operator" data-action="add">
                    +
                </button>

            </div>


            <!-- PARTE INFERIOR -->
            <div class="calculator-footer">

                <button class="clear" data-action="clear">
                    AC
                </button>

                <span>
                    OPERACIONES BÁSICAS · FUNCIONES CIENTÍFICAS
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
